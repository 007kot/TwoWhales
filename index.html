<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Два Кита — Договор купли-продажи</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=PT+Sans:wght@400;700&family=PT+Mono&display=swap">

    <link rel="stylesheet" href="style.css">

    <!-- defer, чтобы скрипты не блокировали первую отрисовку страницы —
         в Safari это особенно заметно как "рваная" загрузка стилей -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/docxtemplater/3.66.3/docxtemplater.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/pizzip@3.2.0/dist/pizzip.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jquery.inputmask/5.0.9/inputmask.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jquery.inputmask/5.0.9/bindings/inputmask.binding.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/docxtemplater@3.66.5/build/docxtemplater.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/docxtemplater-table-module@1.2.0/dist/table.js"></script>
    <script defer src="./script.js"></script>
</head>
<body>
    <div class="formbold-main-wrapper">
        <div class="formbold-form-wrapper">
            <form action="https://formbold.com/s/FORM_ID" method="POST">
                <div class="formbold-form-title">
                    <span class="form-eyebrow">Договор купли-продажи недвижимости</span>
                    <div class="brand-lockup">
                        <img src="logo-mark.png" alt="Два Кита" class="brand-logo" width="120" height="111">
                        <h2 class="brand-title">Два Кита</h2>
                    </div>
                    <p>
                        Заполните все активные поля перед генерацией файла
                    </p>
                </div>

                <div class="formbold-input-flex">
                    <div>
                        <label for="property_type" class="formbold-form-label">
                            Тип Недвижимости
                        </label>
                        <select
                            name="property_type"
                            id="property_type"
                            class="form-select"
                        >
                            <option value="" disabled selected>— Выберите —</option>
                            <option value="apartment">Квартира</option>
                            <option value="commerce">Коммерция</option>
                            <option value="parking">Парковочное место</option>
                        </select>
                    </div>
                    <div>
                        <label for="contract" class="formbold-form-label"> Тип Договора </label>
                        <select
                            name="contract"
                            id="contract"
                            class="form-select"
                        >
                            <option value="" disabled selected>— Выберите —</option>
                            <option value="cash">Договор за наличку</option>
                            <option value="installment">Договор рассрочка</option>
                        </select>
                    </div>
                </div>

                <div class="formbold-input-flex">
                    <div>
                        <label for="current_date" class="formbold-form-label"> Дата Заключения Договора </label>
                        <input
                            type="date"
                            name="current_date"
                            id="current_date"
                            class="formbold-form-input"
                            required
                        />
                    </div>
                </div>

                <div class="form-section-divider">
                    <span class="form-section-title">Персональные данные</span>
                </div>

                <div class="formbold-mb-3">
                    <label for="fullname" class="formbold-form-label"> ФИО </label>
                    <input
                        type="text"
                        name="fullname"
                        id="fullname"
                        class="formbold-form-input"
                        required
                    />
                </div>
                <div class="formbold-input-flex">
                    <div>
                        <label for="birthdate" class="formbold-form-label"> Дата рождения </label>
                        <input
                            type="date"
                            name="birthdate"
                            id="birthdate"
                            class="formbold-form-input"
                            required
                        />
                    </div>

                    <div>
                        <label for="phone_number" class="formbold-form-label"> Номер телефона </label>
                        <input
                            type="tel"
                            name="phone_number"
                            id="phone_number"
                            placeholder="+7 (___) ___-__-__"
                            class="formbold-form-input"
                            required
                        />
                    </div>
                </div>

                <div class="formbold-input-flex">
                    <div>
                        <label for="passport" class="formbold-form-label"> Паспорт (Серия Номер) </label>
                        <input
                            type="text"
                            name="passport"
                            id="passport"
                            class="formbold-form-input"
                            required
                        />
                    </div>
                    <div>
                        <label for="passport_issue_date" class="formbold-form-label"> Дата выдачи </label>
                        <input
                            type="date"
                            name="passport_issue_date"
                            id="passport_issue_date"
                            class="formbold-form-input"
                            required
                        />
                    </div>
                </div>

                <div class="formbold-mb-3">
                    <label for="passport_issued_by" class="formbold-form-label"> Кем выдан </label>
                    <input
                        type="text"
                        name="passport_issued_by"
                        id="passport_issued_by"
                        class="formbold-form-input"
                        required
                    />
                </div>

                <div class="formbold-input-flex">
                    <div>
                        <label for="passport_division_code" class="formbold-form-label"> Код подразделения </label>
                        <input
                            type="text"
                            name="passport_division_code"
                            id="passport_division_code"
                            class="formbold-form-input"
                            required
                        />
                    </div>                    
                </div>

                <div class="formbold-mb-3">
                    <label for="registration_address" class="formbold-form-label"> Адрес регистрации </label>
                    <input
                        type="text"
                        name="registration_address"
                        id="registration_address"
                        class="formbold-form-input"
                        required
                    />
                </div>

                <div class="formbold-mb-3">
                    <label for="living_address" class="formbold-form-label"> Адрес проживания </label>
                    <input
                        type="text"
                        name="living_address"
                        id="living_address"
                        class="formbold-form-input"
                        required
                    />
                </div>

                <div class="form-section-divider">
                    <span class="form-section-title">Объект приобретения</span>
                </div>

                <div class="formbold-input-flex" id="parking_data">
                    <div>
                        <label for="parking_num" class="formbold-form-label"> Номер Парковочного Места </label>
                        <input
                            type="text"
                            name="parking_num"
                            id="parking_num"
                            class="formbold-form-input"
                        />
                    </div>
                </div>

                <div id="apartment_data">
                    <div class="formbold-input-flex">
                        <div>
                            <label for="building" class="formbold-form-label"> Корпус </label>
                            <input
                                type="text"
                                name="building"
                                id="building"
                                class="formbold-form-input"
                            />
                        </div>
                        <div>
                            <label for="construction_number" class="formbold-form-label"> Строительный номер </label>
                            <input
                                type="text"
                                name="construction_number"
                                id="construction_number"
                                class="formbold-form-input"
                            />
                        </div>
                    </div>

                    <div class="formbold-input-flex">
                        <div>
                            <label for="floor" class="formbold-form-label"> Этаж </label>
                            <input
                                type="number"
                                name="floor"
                                id="floor"
                                class="formbold-form-input"
                            />
                        </div>
                        <div id="rooms_field">
                            <label for="rooms" class="formbold-form-label"> Количество комнат </label>
                            <input
                                type="text"
                                name="rooms"
                                id="rooms"
                                class="formbold-form-input"
                            />
                        </div>
                    </div>

                    <div class="formbold-input-flex">
                        <div>
                            <label for="area" class="formbold-form-label"> Общая проектная площадь (м²) </label>
                            <input
                                type="text"
                                name="area"
                                id="area"
                                class="formbold-form-input"
                            />
                        </div>
                    </div>
                </div>

                <div class="form-section-divider">
                    <span class="form-section-title">Расчет стоимости</span>
                </div>

                <div class="formbold-input-flex">
                    <div>
                        <label for="initial_payment" class="formbold-form-label"> Первоначальный взнос (₽) </label>
                        <input
                            type="number"
                            name="initial_payment"
                            id="initial_payment"
                            class="formbold-form-input"
                        />
                    </div>
                    <div>
                        <label for="installment_period" class="formbold-form-label"> Срок рассрочки (мес.) </label>
                        <input
                            type="number"
                            name="installment_period"
                            id="installment_period"
                            class="formbold-form-input"
                        />
                    </div>
                </div>

                <div class="formbold-input-flex">
                    <div>
                        <label for="price_per_square" class="formbold-form-label"> Цена за м² (₽) </label>
                        <input
                            type="number"
                            name="price_per_square"
                            id="price_per_square"
                            class="formbold-form-input"
                            required
                        />
                    </div>
                    <div>
                        <label for="total_area" class="formbold-form-label"> Общая площадь (м²) </label>
                        <input
                            type="number"
                            name="total_area"
                            id="total_area"
                            step="0.01"
                            class="formbold-form-input"
                            required
                        />
                    </div>
                </div>

                <div class="formbold-checkbox-wrapper">
                    <label for="supportCheckbox" class="formbold-checkbox-label">
                    <div class="formbold-relative">
                        <input
                            type="checkbox"
                            id="supportCheckbox"
                            class="formbold-input-checkbox"
                        />
                        <div class="formbold-checkbox-inner">
                        <span class="formbold-opacity-0">
                            <svg
                                width="11"
                                height="8"
                                viewBox="0 0 11 8"
                                class="formbold-stroke-current"
                                fill="none"
                                xmlns="http://www.w3.org/2000/svg"
                            >
                            <path
                                d="M8.81868 0.688604L4.16688 5.4878L2.05598 3.29507C1.70417 2.92271 1.1569 2.96409 0.805082 3.29507C0.453266 3.66742 0.492357 4.24663 0.805082 4.61898L3.30689 7.18407C3.54143 7.43231 3.85416 7.55642 4.16688 7.55642C4.47961 7.55642 4.79233 7.43231 5.02688 7.18407L10.0696 2.05389C10.4214 1.68154 10.4214 1.10233 10.0696 0.729976C9.71776 0.357624 9.17049 0.357625 8.81868 0.688604Z"
                                fill="white"
                            />
                            </svg>
                        </span>
                        </div>
                    </div>
                    Оплата со следующего месяца
                    </label>
                </div>

                <div class="btns">
                    <button class="formbold-btn" id="submit">Скачать Договор</button>
                    <button class="formbold-btn" id="graph" type="button">График платежей</button>
                </div>
                <div id="payment-preview"></div>
            </form>
        </div>
    </div>
</body>
</html>
